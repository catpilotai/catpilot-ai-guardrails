name: baseline

# Runs on every pull request, whatever it changes, so branch protection always has a check to
# require. The other workflows run only when their paths change; this one keeps edits to any
# workflow (including Dependabot's action bumps) covered by tests/test_workflows.py, and runs the
# whole unit suite, so a change to deploy/, skills/, docs/ or the plugin manifest is tested too.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt

      - name: Workflows parse, run read-only, and pin actions to commit SHAs
        run: python -m unittest discover -s tests -p test_workflows.py -v

      - name: Unit tests (hooks, harness gates, tools, MCP server, deploy scripts, manifests)
        run: python -m unittest discover -s tests
