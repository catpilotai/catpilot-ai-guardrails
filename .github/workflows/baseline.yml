name: baseline

# Runs on every pull request, whatever it changes, so branch protection always has a check to
# require. The other workflows run only when their paths change; this one keeps edits to any
# workflow (including Dependabot's action bumps) covered by tests/test_workflows.py.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt

      - name: Workflows parse, run read-only, and pin actions to commit SHAs
        run: python -m unittest discover -s tests -p test_workflows.py -v
