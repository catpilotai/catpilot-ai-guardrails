name: evaluation-foundation

on:
  pull_request:
    paths:
      - "evals/**"
      - "tools/**"
      - "plugins/**"
      - "examples/**"
      - "requirements-dev.*"
      - "setup.sh"
      - "tests/**"
      - "src/skills/**"
      - ".github/workflows/evaluation-foundation.yml"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "tools/**"
      - "plugins/**"
      - "examples/**"
      - "requirements-dev.*"
      - "setup.sh"
      - "tests/**"
      - "src/skills/**"
      - ".github/workflows/evaluation-foundation.yml"

permissions:
  contents: read

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate synthetic inputs (not agent behavior)
        run: python tools/validate_evals.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install locked test and MCP dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
      - name: Test validators, filesystem safety, examples, policy, and MCP transport
        run: python -m unittest discover -s tests -v
