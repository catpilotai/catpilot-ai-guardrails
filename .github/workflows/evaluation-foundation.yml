name: evaluation-foundation

on:
  pull_request:
    paths:
      - "evals/**"
      - "tools/**"
      - "hooks/**"
      - "mcp-server/**"
      - "requirements-dev.*"
      - "tests/**"
      - "src/skills/**"
      - ".github/workflows/evaluation-foundation.yml"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "tools/**"
      - "hooks/**"
      - "mcp-server/**"
      - "requirements-dev.*"
      - "tests/**"
      - "src/skills/**"
      - ".github/workflows/evaluation-foundation.yml"

permissions:
  contents: read

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
      - name: Validate synthetic inputs (not agent behavior)
        run: |
          python tools/validate_evals.py
          python tools/eval.py
      - name: Run the offline test suite
        run: python -m unittest discover -s tests -v
      - name: Install the pinned functional verifier image
        run: docker pull python:3.11-slim@sha256:9534e5a8e315485d4061ed659af0fd78a284c015f9b73661b41d6bab25604534
      - name: Verify completion and outcomes on public reference programs
        run: >-
          python tools/bench/selfcheck.py
          --scenarios evals/scenarios-functional-demo
          --examples evals/reference-examples/functional-demo
