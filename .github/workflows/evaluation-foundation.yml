name: evaluation-foundation

on:
  pull_request:
    paths:
      - "evals/**"
      - "tools/validate_evals.py"
      - "tests/**"
      - "src/skills/**"
      - ".github/workflows/evaluation-foundation.yml"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "tools/validate_evals.py"
      - "tests/**"
      - "src/skills/**"
      - ".github/workflows/evaluation-foundation.yml"

permissions:
  contents: read

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate synthetic inputs (not agent behavior)
        run: python tools/validate_evals.py
      - name: Test the fixture validator
        run: python -m unittest discover -s tests -v
