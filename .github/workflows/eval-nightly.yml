name: eval-nightly

# With/without evaluation of the safe-building scenarios against Claude Code.
# Needs the ANTHROPIC_API_KEY repository secret. Without it the job exits
# early and records nothing. The report is printed to the job summary; a
# human reviews it and commits it under evals/reports/ deliberately. It is
# never committed automatically.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  with-without:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not configured; skipping the model run." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Install pinned dependencies
        if: steps.key.outputs.present == 'true'
        run: |
          python -m pip install "pyyaml==6.0.3"
          npm install -g @anthropic-ai/claude-code@2.1.241
      - name: Run with/without evaluation (heuristic scoring)
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python tools/eval.py --host claude --binary "$(command -v claude)" --model claude-haiku-4-5-20251001 \
            --injection installed --runs 1 --max-calls 40 --report evals/reports/nightly.md --execute
      - name: Publish the report to the job summary
        if: steps.key.outputs.present == 'true'
        run: cat evals/reports/nightly.md >> "$GITHUB_STEP_SUMMARY"
