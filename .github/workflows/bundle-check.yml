name: bundle-check

on:
  pull_request:
    paths:
      - "src/skills/**"
      - "skills/**"
      - "tools/bundle.py"
      - "tools/package_plugin.py"
      - "tools/validate_skill.py"
      - "plugins/**"
      - "requirements-dev.*"
      - ".github/workflows/bundle-check.yml"
  push:
    branches: [main]
    paths:
      - "src/skills/**"
      - "skills/**"
      - "tools/bundle.py"
      - "tools/package_plugin.py"
      - "tools/validate_skill.py"
      - "plugins/**"
      - "requirements-dev.*"
      - ".github/workflows/bundle-check.yml"

permissions:
  contents: read

jobs:
  bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install bundler dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt

      - name: Verify skills/ is the deterministic output of src/skills/
        run: python tools/bundle.py --check
      - name: Verify plugin copy and portable packages
        run: |
          python tools/package_plugin.py --check
          python tools/validate_skill.py skills/catpilot-security-core
