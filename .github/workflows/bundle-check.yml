name: bundle-check

on:
  pull_request:
    paths:
      - "src/skills/**"
      - "skills/**"
      - "dist/**"
      - "tools/bundle.py"
      - "tools/targets.py"
      - "tools/validate_skill.py"
      - "tools/validate_overlay.py"
      - "mcp-server/**"
      - "requirements-dev.*"
      - ".github/workflows/bundle-check.yml"
  push:
    branches: [main]
    paths:
      - "src/skills/**"
      - "skills/**"
      - "dist/**"
      - "tools/bundle.py"
      - "tools/targets.py"
      - "tools/validate_skill.py"
      - "tools/validate_overlay.py"
      - "mcp-server/**"
      - "requirements-dev.*"
      - ".github/workflows/bundle-check.yml"

permissions:
  contents: read

jobs:
  bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install bundler dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt

      - name: Verify skills/ and dist/ are the deterministic output of src/skills/
        run: python tools/bundle.py --check

      - name: Validate every source component and shipped bundle
        run: python tools/validate_skill.py

      - name: Validate the synthetic overlay example
        run: python tools/validate_overlay.py docs/spec/overlay.example.yaml --allow-host intranet.example.org
