name: release-attestations

# Signs each published release with GitHub artifact attestations (Sigstore, keyless through GitHub OIDC):
# build provenance for the source archive and the Claude.ai skill zip, and an SPDX SBOM of the pinned Python
# dependencies, then attaches all three files to the release. Verify a download with:
#   gh attestation verify <file> --repo catpilotai/catpilot-ai-guardrails
# The only workflow allowed write permissions; tests/test_workflows.py holds it to exactly these.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attest (for example 2026.10.28)
        required: true

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Refuse anything but a CalVer release tag
        run: '[[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]]'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build the release files
        run: |
          set -euo pipefail
          mkdir out
          git archive --format=tar.gz --prefix="catpilot-ai-guardrails-${TAG}/" -o "out/catpilot-ai-guardrails-${TAG}.tar.gz" HEAD
          zips=(dist/*/catpilot-safe-building.zip)
          [ "${#zips[@]}" -eq 1 ] && [ -f "${zips[0]}" ]
          cp "${zips[0]}" out/catpilot-safe-building.zip
          created="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
          python tools/sbom.py --tag "$TAG" --created "$created" > "out/catpilot-ai-guardrails-${TAG}.spdx.json"
          sha256sum out/*

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/catpilot-ai-guardrails-*.tar.gz
            out/catpilot-safe-building.zip

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: out/catpilot-ai-guardrails-*.tar.gz
          sbom-path: out/catpilot-ai-guardrails-${{ env.TAG }}.spdx.json

      - name: Attach the attested files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
